name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package with dev extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Metadata sanity
        run: |
          bountypilot --version
          bountypilot --help > /dev/null
      - name: Lint
        run: ruff check src tests
      - name: Format check
        run: ruff format --check src tests
      - name: Type check
        run: mypy src/bountypilot
      - name: Tests (offline; mocked integration - no credentials needed)
        run: pytest tests -q --ignore=tests/integration/test_live_gibwork.py
      - name: Dependency security audit (best effort)
        run: |
          pip install pip-audit || true
          pip-audit -r <(python -m pip freeze) || true
        continue-on-error: true

  # Opt-in live check: runs ONLY when a repository secret enables it.
  # No credentials are stored in this workflow file.
  live-gibwork:
    runs-on: ubuntu-latest
    if: vars.ENABLE_LIVE_GIBWORK_CHECKS == '1'
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Live read-only Gibwork checks
        env:
          BOUNTYPILOT_LIVE_TESTS: "1"
        run: pytest tests/integration/test_live_gibwork.py -q
