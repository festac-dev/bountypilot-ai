[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bountypilot-ai"
version = "0.1.3"
description = "BountyPilot AI - terminal-based Gibwork bounty intelligence, evaluation, planning and submission packaging for developers."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "BountyPilot AI contributors" }]
keywords = ["gibwork", "bounty", "cli", "terminal", "solana", "developer-tools"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Build Tools",
]
# Runtime and development tooling are installed together on purpose: a plain
# `pip install -e .` yields a complete environment (CLI + make test/lint/typecheck).
# All of these are pure-Python wheels, so Termux needs no native toolchain.
dependencies = [
    "typer>=0.12",
    "click>=8.1",
    "rich>=13.0",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "ruff>=0.4",
    "mypy>=1.8",
    "types-requests>=2.31",
]

[project.scripts]
bountypilot = "bountypilot.main:app_entry"

[project.urls]
Homepage = "https://github.com/festac-dev/bountypilot-ai"
Documentation = "https://github.com/festac-dev/bountypilot-ai/tree/main/docs"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bountypilot = ["py.typed"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "S"]
ignore = ["UP007", "UP006", "UP035", "UP045", "B008", "B904", "S101", "UP015", "UP022"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B017"]
"src/bountypilot/commands/interactive.py" = ["S"]
# The video renderer shells out to the locally installed CLI/ffmpeg and uses
# random only for audio jitter; neither handles untrusted input.
"scripts/*" = ["S603", "S311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
